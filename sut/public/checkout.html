<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout — Aperture Store</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/">Aperture Store</a>
    <nav class="nav" aria-label="Main">
      <a class="nav-link" href="/">Shop</a>
      <a class="nav-cart" id="cart-link" href="/cart">Cart ({{COUNT}})</a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Checkout</h1>

    <!-- Each interactive element sits in its own labelled region. That gives every
         registry key a distinct ancestor-role + neighbour-text signature, so a pure
         label rename can never drag the heal score below the 0.60 gate. -->
    <section class="panel" aria-label="Contact details">
      <h2>Contact</h2>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" class="fld" name="email" type="email" placeholder="you@example.com" required>
      </div>
      <!-- PLANTED (WCAG 4.1.2 / 3.3.2): the text below LOOKS like a label but is a <span>,
           so there is no programmatic association and no accessible name. Note a
           `placeholder` would have satisfied axe's label rule, which is why there isn't
           one — this is the realistic version of the bug, not the easy one. -->
      <div class="field">
        <span class="pseudo-label">Card number</span>
        <input id="card" class="fld" name="card" type="text">
        <!-- PLANTED (WCAG 1.4.3): #999 on #fff is ~2.85:1, below the 4.5:1 minimum. -->
        <p class="hint-faint">We never store your card details.</p>
      </div>
    </section>

    <section class="panel" aria-label="Promo code">
      <h2>Promo</h2>
      <form method="post" action="/checkout/promo" class="promo-row">
        <label for="promo">Promo code</label>
        <input id="promo" class="fld" name="promo" type="text" placeholder="SAVE10">
        <button class="btn btn--ghost" id="apply-promo" type="submit">Apply Promo</button>
      </form>
      <!-- Rendered via innerHTML by app.js — this is the XSS sink. -->
      <p class="promo-msg" id="promo-msg" data-msg="{{PROMO_ERROR}}"></p>
    </section>

    <section class="panel" aria-label="Order summary">
      <h2>Order Summary</h2>
      <dl class="totals">
        <dt>Subtotal</dt><dd id="subtotal">{{SUBTOTAL}}</dd>
        <dt>Discount</dt><dd id="discount">{{DISCOUNT}}</dd>
        <dt>Tax</dt><dd id="tax">{{TAX}}</dd>
        <dt>Total</dt><dd id="order-total">{{TOTAL}}</dd>
      </dl>
      <!-- PLANTED (WCAG 4.1.2): the glyph is aria-hidden, so the button has NO accessible
           name at all. Leaving the glyph exposed would have given it the name "ⓘ" and axe
           would have passed it. -->
      <button class="icon-btn" id="info-toggle" type="button"><span aria-hidden="true">&#9432;</span></button>
    </section>

    <section class="panel" aria-label="Place your order">
      <h2>Confirm</h2>
      <form method="post" action="/checkout/place">
        <input type="hidden" name="email" value="">
        <div class="field field--inline">
          <input id="terms" class="chk" name="terms" type="checkbox">
          <label for="terms">I agree to the terms of sale</label>
        </div>
        <button class="btn btn--primary" id="place-order-btn" type="submit">Pay With Confidence</button>
      </form>
    </section>
  </main>

  <script src="/vendor/jquery.js"></script>
  <script src="/app.js"></script>
</body>
</html>
