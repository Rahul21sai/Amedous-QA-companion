<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmed — Aperture Store</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/">Aperture Store</a>
    <nav class="nav" aria-label="Main">
      <a class="nav-link" href="/">Shop</a>
      <a class="nav-cart" id="cart-link" href="/cart">Cart ({{COUNT}})</a>
    </nav>
  </header>
  <main class="wrap">
    <h1>Order confirmed</h1>
    <p class="confirm-total">Charged <strong id="charged-total">{{TOTAL}}</strong></p>
    <a class="btn btn--primary" id="back-to-shop" href="/">Back to Shop</a>
  </main>
</body>
</html>
